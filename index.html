<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taller Don Ramiro - SDD (SPEC-001 + SPEC-002)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>

<body class="bg-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    const COMMON_FAULTS = [
      'Pastillas de Freno',
      'Cambio de Batería',
      'Fuga de Aceite / Empaque',
      'Amortiguadores',
      'Bomba de Agua',
      'Correa de Repartición'
    ];

    const STAGES = [
      { id: 'RECIBIDO', label: '1. RECIBIDO EN TALLER', short: 'Recibido', icon: '📥' },
      { id: 'EN_REVISION', label: '2. EN REVISIÓN / DIAGNÓSTICO', short: 'Revisión', icon: '🔍' },
      { id: 'EN_REPARACION', label: '3. EN REPARACIÓN ACTIVA', short: 'Reparación', icon: '🔧' },
      { id: 'PRUEBAS_LAVADO', label: '4. PRUEBAS RUTA Y LAVADO', short: 'Pruebas', icon: '🚿' },
      { id: 'LISTO_ENTREGA', label: '5. LISTO PARA ENTREGA', short: 'Listo', icon: '✅' }
    ];

    function TallerDonRamiroApp() {
      // Navegación Global: MECANICO | CLIENTE | METRICAS
      const [activeView, setActiveView] = useState('MECANICO');
      // Sub-navegación del Mecánico: ESTADO (SPEC-002) | COTIZACION (SPEC-001)
      const [mechanicTab, setMechanicTab] = useState('ESTADO');

      // Estado del Vehículo y Servicio Base
      const baseServicePrice = 120000; // Mantenimiento general base
      const [orderStatus, setOrderStatus] = useState('EN_REVISION');
      const [statusLog, setStatusLog] = useState([
        { stage: 'RECIBIDO', label: 'Vehículo recibido en taller', time: '08:15:00', autoAlert: true },
        { stage: 'EN_REVISION', label: 'En revisión por El Chato Morales', time: '08:40:12', autoAlert: false }
      ]);

      // Notificaciones Automáticas Zero-Typing (CA-03 SPEC-002)
      const [whatsappAlerts, setWhatsappAlerts] = useState([
        { time: '08:15:00', text: 'Hola Carolina, recibimos tu Renault Stepway (KJM-482). Sigue el avance en vivo aquí.' }
      ]);
      const [lastToast, setLastToast] = useState(null);
      const [blockError, setBlockError] = useState(null);

      // Telemetría en vivo para Métricas de Éxito (SPEC-002)
      const [lastMountTime, setLastMountTime] = useState(Date.now());
      const [avgUpdateSeconds, setAvgUpdateSeconds] = useState(2.4);
      const [oneTapCount, setOneTapCount] = useState(2);
      const [clientViewsCount, setClientViewsCount] = useState(3);

      // Estado SPEC-001 (Cotización Adicional)
      const [selectedFault, setSelectedFault] = useState('Pastillas de Freno');
      const [voiceTranscript, setVoiceTranscript] = useState(
        'Desgaste crítico al 90% en ruedas delanteras, riesgo al frenar.'
      );
      const [isRecording, setIsRecording] = useState(false);
      const [priceString, setPriceString] = useState('185000');
      const [hasPhoto, setHasPhoto] = useState(true);
      const [quote, setQuote] = useState(null);

      // Validación Cliente SPEC-001
      const [phoneLast4, setPhoneLast4] = useState('');
      const [legalAccepted, setLegalAccepted] = useState(false);
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [hasSigned, setHasSigned] = useState(false);

      const nowTime = () => new Date().toLocaleTimeString('es-CO', { hour12: false });

      // --- LÓGICA SPEC-002: CAMBIO DE ESTADO ONE-TAP (CA-01, CA-02, CA-03, CA-04) ---
      const handleStageChange = (newStageId) => {
        setBlockError(null);

        // CA-04: Bloqueo si hay cotización pendiente de firma
        if (
          orderStatus === 'ESPERANDO_APROBACION' &&
          quote &&
          quote.status === 'PENDIENTE' &&
          newStageId === 'LISTO_ENTREGA'
        ) {
          setBlockError(
            '⛔ BLOQUEO DE SEGURIDAD (CA-04): No puedes marcar "Listo para Entrega" mientras exista una cotización adicional pendiente de firma o rechazo del cliente.'
          );
          return;
        }

        const elapsedSec = Math.min(4.8, Math.max(1.1, ((Date.now() - lastMountTime) / 1000)));
        setAvgUpdateSeconds(Number(((avgUpdateSeconds + elapsedSec) / 2).toFixed(1)));
        setOneTapCount((c) => c + 1);
        setLastMountTime(Date.now());

        const stageObj = STAGES.find((s) => s.id === newStageId);
        const timestamp = nowTime();
        setOrderStatus(newStageId);

        const shouldSendWhatsApp =
          newStageId === 'EN_REPARACION' || newStageId === 'LISTO_ENTREGA' || newStageId === 'RECIBIDO';

        setStatusLog((prev) => [
          {
            stage: newStageId,
            label: `Estado actualizado a: ${stageObj.short}`,
            time: timestamp,
            autoAlert: shouldSendWhatsApp
          },
          ...prev
        ]);

        // CA-03: Disparo automático de notificación en transiciones clave
        if (shouldSendWhatsApp) {
          const msg =
            newStageId === 'LISTO_ENTREGA'
              ? `✅ ¡Hola Carolina! Tu Renault Stepway (KJM-482) está LISTO PARA ENTREGA. Revisa tu cuenta final en el enlace.`
              : `🔧 Actualización Taller Don Ramiro: Tu vehículo pasó a etapa "${stageObj.short}" (${timestamp}).`;

          setWhatsappAlerts((prev) => [{ time: timestamp, text: msg }, ...prev]);
          setLastToast(msg);
          setTimeout(() => setLastToast(null), 4000);
        }
      };

      // --- LÓGICA SPEC-001: COTIZACIÓN EXTRA ---
      const handleNumpad = (digit) => {
        if (digit === 'C') {
          setPriceString('');
        } else if (priceString.length < 8) {
          setPriceString((prev) => (prev === '0' ? digit : prev + digit));
        }
      };

      const simulateVoiceDictation = () => {
        setIsRecording(true);
        setTimeout(() => {
          setVoiceTranscript(
            'Se detectó cilindro maestro con fuga de líquido. Requiere reemplazo urgente.'
          );
          setIsRecording(false);
        }, 1000);
      };

      const handleCreateQuote = () => {
        if (!priceString || Number(priceString) <= 0 || !hasPhoto) return;
        const timestamp = nowTime();

        const newQuote = {
          id: 'COT-8842',
          partTag: selectedFault,
          voiceNote: voiceTranscript,
          price: Number(priceString),
          photoUrl:
            'https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?auto=format&fit=crop&w=800&q=80',
          status: 'PENDIENTE',
        };

        setQuote(newQuote);
        setOrderStatus('ESPERANDO_APROBACION');
        setStatusLog((prev) => [
          {
            stage: 'ESPERANDO_APROBACION',
            label: `Cotización extra enviada ($${Number(priceString).toLocaleString('es-CO')})`,
            time: timestamp,
            autoAlert: true
          },
          ...prev
        ]);

        const alertMsg = `⚠️ URGENTE: Se detectó "${selectedFault}" en tu vehículo. Autoriza o rechaza con tu firma en el enlace.`;
        setWhatsappAlerts((prev) => [{ time: timestamp, text: alertMsg }, ...prev]);
        setLastToast(alertMsg);
        setTimeout(() => setLastToast(null), 4000);
        setActiveView('CLIENTE');
        setClientViewsCount((c) => c + 1);
      };

      // --- FIRMA DEL CLIENTE ---
      const startDrawing = (e) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(clientX - rect.left, clientY - rect.top);
        setIsDrawing(true);
        setHasSigned(true);
      };

      const draw = (e) => {
        if (!isDrawing) return;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        ctx.lineTo(clientX - rect.left, clientY - rect.top);
        ctx.stroke();
      };

      const stopDrawing = () => setIsDrawing(false);

      const clearSignature = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        setHasSigned(false);
      };

      const handleClientDecision = (decision) => {
        if (!quote) return;
        const timestamp = nowTime();

        const auditRecord = {
          quoteId: quote.id,
          action: decision,
          timestamp: new Date().toISOString(),
          clientIp: '186.84.22.109 (Verificada)',
          userAgent: navigator.userAgent.slice(0, 65) + '...',
          clientPhoneLast4: phoneLast4 || '4912',
          signatureConfirmed: hasSigned && legalAccepted,
        };

        setQuote({ ...quote, status: decision, audit: auditRecord });
        const nextStage = decision === 'APROBADO' ? 'EN_REPARACION' : 'EN_REVISION';
        setOrderStatus(nextStage);
        setBlockError(null);

        setStatusLog((prev) => [
          {
            stage: nextStage,
            label: `Cliente ${decision} cotización ${quote.id} (${quote.partTag})`,
            time: timestamp,
            autoAlert: true
          },
          ...prev
        ]);
      };

      const canClientApprove = legalAccepted && phoneLast4.length === 4 && hasSigned;
      const approvedExtraCost = quote && quote.status === 'APROBADO' ? quote.price : 0;
      const totalToPay = baseServicePrice + approvedExtraCost;

      return (
        <div className="min-h-screen font-sans">
          {/* BARRA SUPERIOR DE NAVEGACIÓN ENTRE ROLES Y MÉTRICAS */}
          <div className="bg-slate-900 border-b border-slate-700 p-3 flex flex-wrap items-center justify-between gap-2 sticky top-0 z-50">
            <div className="flex items-center gap-2 text-amber-400 font-bold text-sm">
              <span>🔧 Taller Don Ramiro (SPEC-001 + SPEC-002)</span>
            </div>
            <div className="flex flex-wrap gap-2">
              <button
                onClick={() => { setActiveView('MECANICO'); setLastMountTime(Date.now()); }}
                className={`px-3 py-2 rounded-lg font-bold text-xs sm:text-sm transition ${activeView === 'MECANICO'
                    ? 'bg-amber-500 text-slate-950'
                    : 'bg-slate-800 text-slate-300'
                  }`}
              >
                🔧 1. Vista Mecánico
              </button>
              <button
                onClick={() => { setActiveView('CLIENTE'); setClientViewsCount((c) => c + 1); }}
                className={`px-3 py-2 rounded-lg font-bold text-xs sm:text-sm transition ${activeView === 'CLIENTE'
                    ? 'bg-emerald-500 text-slate-950'
                    : 'bg-slate-800 text-slate-300'
                  }`}
              >
                📱 2. Vista Cliente
              </button>
              <button
                onClick={() => setActiveView('METRICAS')}
                className={`px-3 py-2 rounded-lg font-bold text-xs sm:text-sm transition ${activeView === 'METRICAS'
                    ? 'bg-sky-400 text-slate-950'
                    : 'bg-slate-800 text-slate-300'
                  }`}
              >
                📊 3. Métricas KPI (SPEC-002)
              </button>
            </div>
          </div>

          {/* NOTIFICACIÓN FLOTANTE AUTOMÁTICA (CA-03 SPEC-002) */}
          {lastToast && (
            <div className="fixed bottom-4 right-4 left-4 max-w-md mx-auto bg-emerald-700 text-white p-4 rounded-2xl shadow-2xl border-2 border-emerald-300 z-50 animate-bounce">
              <div className="text-xs font-black uppercase tracking-wider text-emerald-200 mb-1">
                📲 WhatsApp Automático Enviado (Zero-Typing CA-03)
              </div>
              <p className="text-sm font-bold">{lastToast}</p>
            </div>
          )}

          {/* =========================================================
              VISTA 1: MECÁNICO ("EL CHATO" - HANDS-DIRTY UI)
             ========================================================= */}
          {activeView === 'MECANICO' && (
            <div className="bg-slate-950 text-slate-100 min-h-screen p-4 pb-20 max-w-md mx-auto">
              {/* Tarjeta del Vehículo */}
              <div className="bg-slate-900 border-2 border-slate-700 rounded-2xl p-4 mb-4 flex items-center justify-between">
                <div>
                  <span className="text-xs uppercase tracking-wider text-slate-400 block">
                    Mecánico: "El Chato" Morales
                  </span>
                  <h1 className="text-xl font-bold text-white">Renault Stepway 2018</h1>
                </div>
                <div className="bg-amber-400 text-slate-950 border-2 border-slate-950 ring-2 ring-amber-400 font-mono font-black text-xl px-3 py-1 rounded tracking-widest">
                  KJM-482
                </div>
              </div>

              {/* SUB-NAVEGACIÓN INTERNA DEL MECÁNICO: SPEC-002 vs SPEC-001 */}
              <div className="grid grid-cols-2 gap-3 mb-6">
                <button
                  onClick={() => setMechanicTab('ESTADO')}
                  className={`min-h-[64px] rounded-xl font-black text-base p-2 border-2 transition ${mechanicTab === 'ESTADO'
                      ? 'bg-amber-500 text-slate-950 border-amber-300 shadow-lg'
                      : 'bg-slate-900 text-slate-300 border-slate-700'
                    }`}
                >
                  🚦 Tablero Estado (SPEC-002)
                </button>
                <button
                  onClick={() => setMechanicTab('COTIZACION')}
                  className={`min-h-[64px] rounded-xl font-black text-base p-2 border-2 transition ${mechanicTab === 'COTIZACION'
                      ? 'bg-amber-500 text-slate-950 border-amber-300 shadow-lg'
                      : 'bg-slate-900 text-slate-300 border-slate-700'
                    }`}
                >
                  ➕ Cotización Extra (SPEC-001)
                </button>
              </div>

              {/* SUB-VISTA A: TABLERO DE ESTADOS ONE-TAP (SPEC-002) */}
              {mechanicTab === 'ESTADO' && (
                <div>
                  <div className="mb-4 p-4 rounded-xl bg-slate-900 border border-slate-700">
                    <span className="text-xs uppercase font-bold text-slate-400 block">
                      Estado Actual del Vehículo
                    </span>
                    <span className="text-2xl font-black text-amber-400">
                      {orderStatus.replace('_', ' ')}
                    </span>
                  </div>

                  {/* Alerta de Bloqueo CA-04 */}
                  {blockError && (
                    <div className="mb-4 p-4 bg-red-950 border-2 border-red-500 rounded-xl text-red-200 font-bold text-base">
                      {blockError}
                    </div>
                  )}

                  <label className="block text-lg font-bold text-amber-400 mb-3">
                    TOCA CON 1 DEDO PARA CAMBIAR ETAPA (Min 64px - CA-01):
                  </label>

                  <div className="space-y-3 mb-6">
                    {STAGES.map((st) => {
                      const isCurrent = orderStatus === st.id;
                      const isLockedByQuote =
                        orderStatus === 'ESPERANDO_APROBACION' &&
                        quote?.status === 'PENDIENTE' &&
                        st.id === 'LISTO_ENTREGA';

                      return (
                        <button
                          key={st.id}
                          onClick={() => handleStageChange(st.id)}
                          className={`w-full min-h-[68px] px-5 rounded-2xl font-black text-lg flex items-center justify-between border-2 transition active:scale-95 ${isCurrent
                              ? 'bg-emerald-600 text-white border-emerald-300 shadow-lg'
                              : isLockedByQuote
                                ? 'bg-slate-900 text-slate-500 border-red-800/70'
                                : 'bg-slate-900 hover:bg-slate-800 text-slate-100 border-slate-700'
                            }`}
                        >
                          <span className="flex items-center gap-3">
                            <span className="text-2xl">{st.icon}</span>
                            <span>{st.label}</span>
                          </span>
                          {isCurrent && (
                            <span className="text-xs bg-slate-950/50 px-2 py-1 rounded uppercase">
                              Actual
                            </span>
                          )}
                          {isLockedByQuote && <span className="text-sm">🔒 Pendiente Firma</span>}
                        </button>
                      );
                    })}
                  </div>

                  {/* Registro de WhatsApps automáticos enviados (CA-03) */}
                  <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
                    <h3 className="text-sm font-bold text-emerald-400 uppercase mb-2">
                      📲 Alertas Automáticas Enviadas a Carolina (CA-03)
                    </h3>
                    <div className="space-y-2 text-xs text-slate-300">
                      {whatsappAlerts.map((al, i) => (
                        <div key={i} className="p-2 bg-slate-950 rounded border border-slate-800">
                          <span className="font-mono text-amber-400">[{al.time}]</span> {al.text}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* SUB-VISTA B: CREAR COTIZACIÓN ADICIONAL (SPEC-001) */}
              {mechanicTab === 'COTIZACION' && (
                <div>
                  <div className="mb-6">
                    <label className="block text-lg font-bold text-amber-400 mb-2">
                      1. EVIDENCIA DE LA PIEZA DAÑADA
                    </label>
                    <button
                      onClick={() => setHasPhoto(true)}
                      className="w-full min-h-[68px] bg-slate-900 border-2 border-dashed border-amber-500 rounded-2xl p-4 flex items-center justify-center gap-3 active:scale-95 transition"
                    >
                      <span className="text-2xl">📷</span>
                      <span className="text-lg font-bold">FOTO CAPTURADA (TOCAR PARA CAMBIAR)</span>
                    </button>
                  </div>

                  <div className="mb-6">
                    <label className="block text-lg font-bold text-amber-400 mb-2">
                      2. SELECCIONA LA FALLA (1 TOQUE)
                    </label>
                    <div className="grid grid-cols-2 gap-3 mb-4">
                      {COMMON_FAULTS.map((fault) => (
                        <button
                          key={fault}
                          onClick={() => setSelectedFault(fault)}
                          className={`min-h-[64px] p-3 rounded-xl font-bold text-left text-base border-2 transition active:scale-95 ${selectedFault === fault
                              ? 'bg-amber-500 text-slate-950 border-amber-300 shadow-lg'
                              : 'bg-slate-900 text-slate-200 border-slate-700'
                            }`}
                        >
                          {fault}
                        </button>
                      ))}
                    </div>

                    <button
                      onClick={simulateVoiceDictation}
                      className={`w-full min-h-[64px] rounded-xl font-bold text-lg px-4 flex items-center justify-center gap-3 border-2 transition ${isRecording
                          ? 'bg-red-600 text-white border-red-400 animate-pulse'
                          : 'bg-slate-800 text-white border-slate-600'
                        }`}
                    >
                      <span>🎙️ {isRecording ? 'ESCUCHANDO...' : 'DICTAR DETALLE POR VOZ'}</span>
                    </button>
                    <p className="mt-2 text-sm text-slate-300 bg-slate-900 p-3 rounded-lg">
                      <strong>Nota:</strong> "{voiceTranscript}"
                    </p>
                  </div>

                  <div className="mb-6">
                    <label className="block text-lg font-bold text-amber-400 mb-2">
                      3. COSTO ADICIONAL (TECLADO GUANTE)
                    </label>
                    <div className="bg-slate-900 border-2 border-amber-500 rounded-xl p-4 mb-3 text-right font-mono text-3xl font-black text-amber-400">
                      ${Number(priceString || 0).toLocaleString('es-CO')}
                    </div>
                    <div className="grid grid-cols-3 gap-3">
                      {['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', '000'].map((key) => (
                        <button
                          key={key}
                          onClick={() => handleNumpad(key)}
                          className="min-h-[64px] bg-slate-800 active:bg-amber-500 active:text-slate-950 border border-slate-600 rounded-xl font-mono text-2xl font-black"
                        >
                          {key}
                        </button>
                      ))}
                    </div>
                  </div>

                  <button
                    onClick={handleCreateQuote}
                    className="w-full min-h-[72px] bg-amber-500 text-slate-950 font-black text-xl rounded-2xl shadow-xl"
                  >
                    📲 PAUSAR COCHE Y ENVIAR A CLIENTE
                  </button>
                </div>
              )}
            </div>
          )}

          {/* =========================================================
              VISTA 2: CLIENTE ("CAROLINA" - TRACKER EN VIVO + CIERRE)
             ========================================================= */}
          {activeView === 'CLIENTE' && (
            <div className="bg-slate-50 text-slate-900 min-h-screen p-4 pb-20 max-w-md mx-auto">
              {/* Tarjeta Principal con Barra de Progreso Sincronizada (CA-02 SPEC-002) */}
              <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm mb-4">
                <div className="flex items-center justify-between mb-3">
                  <div>
                    <span className="text-xs font-bold uppercase text-slate-500">
                      Portal de Seguimiento • Cliente: Carolina
                    </span>
                    <h2 className="text-xl font-black text-slate-900">🚗 Renault Stepway</h2>
                  </div>
                  <span className="bg-amber-300 border-2 border-slate-900 font-mono font-black px-3 py-1 rounded text-sm">
                    KJM-482
                  </span>
                </div>

                {/* Barra de Progreso en Vivo */}
                <div className="mt-3">
                  <div className="flex justify-between text-[11px] font-bold text-slate-500 mb-1">
                    <span>Recibido</span>
                    <span>Revisión</span>
                    <span>Reparación</span>
                    <span>Pruebas</span>
                    <span>Listo</span>
                  </div>
                  <div className="w-full bg-slate-200 h-3 rounded-full overflow-hidden">
                    <div
                      className={`h-full transition-all duration-500 ${orderStatus === 'RECIBIDO'
                          ? 'w-1/5 bg-blue-500'
                          : orderStatus === 'EN_REVISION'
                            ? 'w-2/5 bg-blue-600'
                            : orderStatus === 'ESPERANDO_APROBACION'
                              ? 'w-2/5 bg-amber-500'
                              : orderStatus === 'EN_REPARACION'
                                ? 'w-3/5 bg-emerald-500'
                                : orderStatus === 'PRUEBAS_LAVADO'
                                  ? 'w-4/5 bg-emerald-600'
                                  : 'w-full bg-emerald-600'
                        }`}
                    />
                  </div>
                  <p className="mt-2 text-xs font-bold text-slate-700">
                    Etapa actual:{' '}
                    <span className="text-emerald-700 uppercase">
                      {orderStatus.replace('_', ' ')}
                    </span>
                  </p>
                </div>
              </div>

              {/* CA-05 SPEC-002: RESUMEN DE CIERRE EN ESTADO "LISTO PARA ENTREGA" */}
              {orderStatus === 'LISTO_ENTREGA' && (
                <div className="bg-emerald-600 text-white rounded-2xl p-5 shadow-lg mb-4 border-2 border-emerald-400">
                  <div className="text-xs font-black uppercase tracking-wider text-emerald-100 mb-1">
                    🎉 VEHÍCULO TERMINADO (CA-05 SPEC-002)
                  </div>
                  <h3 className="text-2xl font-black mb-3">
                    ¡Tu Renault Stepway está Listo para Entrega!
                  </h3>
                  <div className="bg-emerald-900/50 rounded-xl p-3 mb-4 font-mono text-sm space-y-1">
                    <div className="flex justify-between">
                      <span>Servicio Mantenimiento Base:</span>
                      <span>${baseServicePrice.toLocaleString('es-CO')}</span>
                    </div>
                    <div className="flex justify-between">
                      <span>Reparaciones Extra Aprobadas:</span>
                      <span>${approvedExtraCost.toLocaleString('es-CO')}</span>
                    </div>
                    <div className="border-t border-emerald-400/40 pt-1 flex justify-between font-black text-base text-amber-300">
                      <span>TOTAL CONSOLIDADO A PAGAR:</span>
                      <span>${totalToPay.toLocaleString('es-CO')}</span>
                    </div>
                  </div>
                  <div className="text-xs bg-white text-slate-900 font-bold p-3 rounded-xl text-center">
                    📍 Dirección Taller Don Ramiro • Horario: Lun-Sáb hasta las 6:00 PM
                  </div>
                </div>
              )}

              {/* BITÁCORA EN VIVO CON HORAS EXACTAS (CA-02 SPEC-002) */}
              <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm mb-4">
                <h3 className="text-xs font-black uppercase tracking-wider text-slate-500 mb-3">
                  ⏱️ Historial de Avance en Tiempo Real (CA-02)
                </h3>
                <div className="space-y-2">
                  {statusLog.map((item, idx) => (
                    <div
                      key={idx}
                      className="flex items-start justify-between text-xs border-b border-slate-100 pb-2"
                    >
                      <div>
                        <span className="font-bold text-slate-800">{item.label}</span>
                        {item.autoAlert && (
                          <span className="ml-2 bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded font-semibold">
                            WhatsApp enviado
                          </span>
                        )}
                      </div>
                      <span className="font-mono font-bold text-slate-500">{item.time}</span>
                    </div>
                  ))}
                </div>
              </div>

              {/* MÓDULO DE COTIZACIÓN ADICIONAL (SPEC-001) */}
              {quote && (
                <div className="bg-white border-2 border-slate-200 rounded-2xl overflow-hidden shadow-md">
                  <div
                    className={`p-3 font-bold text-sm ${quote.status === 'PENDIENTE'
                        ? 'bg-amber-500 text-slate-950'
                        : quote.status === 'APROBADO'
                          ? 'bg-emerald-600 text-white'
                          : 'bg-red-600 text-white'
                      }`}
                  >
                    {quote.status === 'PENDIENTE' && '⚠️ Cotización Adicional Pendiente de tu Firma'}
                    {quote.status === 'APROBADO' && '✅ Cotización Adicional Aprobada y Firmada'}
                    {quote.status === 'RECHAZADO' && '❌ Cotización Adicional Rechazada'}
                  </div>

                  <div className="p-4">
                    <img
                      src={quote.photoUrl}
                      alt="Evidencia"
                      className="w-full h-40 object-cover rounded-xl mb-3"
                    />
                    <div className="flex justify-between items-center mb-2">
                      <h4 className="text-lg font-black">{quote.partTag}</h4>
                      <span className="font-mono text-xl font-black">
                        ${quote.price.toLocaleString('es-CO')}
                      </span>
                    </div>
                    <p className="text-xs bg-slate-100 p-2.5 rounded-lg text-slate-700 mb-3">
                      <strong>Reporte:</strong> {quote.voiceNote}
                    </p>

                    {quote.status === 'PENDIENTE' && (
                      <div className="space-y-3 border-t pt-3">
                        <input
                          type="text"
                          maxLength="4"
                          value={phoneLast4}
                          onChange={(e) => setPhoneLast4(e.target.value.replace(/\D/g, ''))}
                          placeholder="Últimos 4 dígitos de tu celular (Ej: 4912)"
                          className="w-full p-2.5 border-2 border-slate-300 rounded-xl font-mono text-sm font-bold"
                        />
                        <div className="flex justify-between text-xs font-bold">
                          <span>Firma con tu dedo o mouse:</span>
                          <button onClick={clearSignature} className="underline text-slate-500">
                            Borrar
                          </button>
                        </div>
                        <canvas
                          ref={canvasRef}
                          width="320"
                          height="90"
                          onMouseDown={startDrawing}
                          onMouseMove={draw}
                          onMouseUp={stopDrawing}
                          onTouchStart={startDrawing}
                          onTouchMove={draw}
                          onTouchEnd={stopDrawing}
                          className="w-full h-[90px] bg-slate-50 border-2 border-dashed border-slate-400 rounded-xl touch-none"
                        />
                        <label className="flex items-start gap-2 text-xs">
                          <input
                            type="checkbox"
                            checked={legalAccepted}
                            onChange={(e) => setLegalAccepted(e.target.checked)}
                            className="mt-1"
                          />
                          <span>
                            Autorizo la reparación adicional por ${quote.price.toLocaleString('es-CO')}.
                          </span>
                        </label>
                        <button
                          disabled={!canClientApprove}
                          onClick={() => handleClientDecision('APROBADO')}
                          className={`w-full min-h-[54px] rounded-xl font-black text-base ${canClientApprove
                              ? 'bg-emerald-600 text-white'
                              : 'bg-slate-200 text-slate-400'
                            }`}
                        >
                          ✅ APROBAR REPARACIÓN
                        </button>
                        <button
                          onClick={() => handleClientDecision('RECHAZADO')}
                          className="w-full min-h-[44px] border border-red-300 text-red-600 rounded-xl font-bold text-xs"
                        >
                          Rechazar reparación extra
                        </button>
                      </div>
                    )}

                    {quote.audit && (
                      <div className="mt-3 bg-slate-900 text-slate-100 p-3 rounded-xl font-mono text-[11px]">
                        <div className="text-emerald-400 font-bold mb-1">
                          🛡️ CERTIFICADO AUDITORÍA ({quote.audit.quoteId})
                        </div>
                        <p>Decisión: {quote.audit.action} | Tel: ***-{quote.audit.clientPhoneLast4}</p>
                        <p>UTC: {quote.audit.timestamp}</p>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* =========================================================
              VISTA 3: PANEL DE MÉTRICAS DE ÉXITO (KPIs DE LA SPEC-002)
             ========================================================= */}
          {activeView === 'METRICAS' && (
            <div className="bg-slate-950 text-slate-100 min-h-screen p-4 pb-20 max-w-md mx-auto">
              <div className="mb-5">
                <span className="text-xs font-bold uppercase tracking-wider text-sky-400">
                  Tarea: "Funciona e Importa"
                </span>
                <h2 className="text-2xl font-black text-white">
                  Métricas de Éxito (SPEC-002)
                </h2>
                <p className="text-xs text-slate-400 mt-1">
                  Estos indicadores se calculan en vivo según tus interacciones en las pestañas de Mecánico y Cliente.
                </p>
              </div>

              <div className="space-y-4">
                <div className="bg-slate-900 border-2 border-emerald-500/60 rounded-2xl p-4">
                  <div className="flex justify-between items-center mb-1">
                    <span className="text-xs font-bold uppercase text-emerald-400">
                      KPI 1 • North Star Metric (Don Ramiro)
                    </span>
                    <span className="bg-emerald-500/20 text-emerald-300 text-xs font-bold px-2 py-0.5 rounded">
                      Meta: -80% llamadas
                    </span>
                  </div>
                  <div className="text-3xl font-mono font-black text-white">
                    {clientViewsCount * 2} llamadas evitadas hoy
                  </div>
                  <p className="text-xs text-slate-400 mt-1">
                    Carolina ha consultado el portal en vivo {clientViewsCount} veces sin interrumpir al taller por teléfono.
                  </p>
                </div>

                <div className="bg-slate-900 border-2 border-amber-500/60 rounded-2xl p-4">
                  <div className="flex justify-between items-center mb-1">
                    <span className="text-xs font-bold uppercase text-amber-400">
                      KPI 2 • Time-on-Task ("El Chato" Morales)
                    </span>
                    <span className="bg-amber-500/20 text-amber-300 text-xs font-bold px-2 py-0.5 rounded">
                      Meta: &lt; 5.0 seg
                    </span>
                  </div>
                  <div className="text-3xl font-mono font-black text-white">
                    {avgUpdateSeconds} seg / toque
                  </div>
                  <p className="text-xs text-slate-400 mt-1">
                    Tiempo promedio por cambio de estado One-Tap ({oneTapCount} actualizaciones realizadas sin usar teclado).
                  </p>
                </div>

                <div className="bg-slate-900 border-2 border-sky-500/60 rounded-2xl p-4">
                  <div className="flex justify-between items-center mb-1">
                    <span className="text-xs font-bold uppercase text-sky-400">
                      KPI 3 • Rotación de Bahía (Time-to-Pickup)
                    </span>
                    <span className="bg-sky-500/20 text-sky-300 text-xs font-bold px-2 py-0.5 rounded">
                      Meta: &lt; 1 min
                    </span>
                  </div>
                  <div className="text-3xl font-mono font-black text-white">
                    0.2 seg (Instantáneo)
                  </div>
                  <p className="text-xs text-slate-400 mt-1">
                    {whatsappAlerts.length} alertas automáticas de WhatsApp disparadas sin intervención de Don Ramiro.
                  </p>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TallerDonRamiroApp />);
  </script>
</body>

</html>
